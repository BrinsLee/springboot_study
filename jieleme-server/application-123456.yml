# MySQL 密码为 123456 配置模板
# 如果你的 MySQL 密码是 123456，用这个替换 application.yml

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: jieleme-server
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/jieleme?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456  # 密码 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

auth:
  jwt-secret: "jieleme_secret_key_change_me_in_production_2026"
  token-expire-seconds: 2592000
  test-mode: true
  sms-expire-seconds: 300
  sms-min-interval-seconds: 60
  sms-max-per-hour: 5

logging:
  level:
    com.jieleme: debug
