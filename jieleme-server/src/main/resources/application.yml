server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: jieleme-server
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/jieleme?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: bring952480??
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 自定义配置
auth:
  jwt-secret: "jieleme_secret_key_change_me_in_production_2026"
  token-expire-seconds: 2592000  # 30天
  test-mode: true
  sms-expire-seconds: 300        # 5分钟
  sms-min-interval-seconds: 60   # 60秒内不能重复发送
  sms-max-per-hour: 5            # 1小时最多5次

logging:
  level:
    com.jieleme: debug

ai:
  provider:
    active: volcengine
  volcengine:
    ak: "替换为你的真实的 AK"
    sk: "替换为你的真实的 SK"